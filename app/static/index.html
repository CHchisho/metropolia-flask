<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Knowledge Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d4002a'/%3E%3Cpath d='M9 8h14v14H11a2 2 0 0 1-2-2V8Z M9 20a2 2 0 0 1 2-2h12' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M9 8h7"/></svg>
        </div>
        <div>
          <div class="brand-name">Knowledge Assistant</div>
          <div class="brand-sub">Ask your documents</div>
        </div>
      </div>

      <nav class="nav" aria-label="Main">
        <a href="#/chat" class="nav-link" data-route="chat">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
          Chat
        </a>
        <a href="#/documents" class="nav-link" data-route="documents">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
          Documents
          <span class="nav-count" id="doc-count" hidden></span>
        </a>
      </nav>

      <div class="history" id="history-section">
        <div class="history-head">
          <span>Recent chats</span>
          <button class="link-btn" id="new-chat" type="button">+ New</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="page-title">Chat</h1>
        <span class="badge" id="mode-badge" hidden></span>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
